[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-prompt"
version = "0.1.0"
description = "Capture microphone audio, transcribe it with OpenRouter, and append it to prompt.md."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
speech-prompt = "speech_prompt.cli:main"

[tool.setuptools.packages.find]
include = ["speech_prompt*"]
